<!doctype html><html lang="en" class="bg-slate-950 text-slate-100"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aniz Nyaa Search</title><script src="https://cdn.tailwindcss.com"></script></head><body><nav class="border-b border-slate-800 bg-slate-900/80"><div class="mx-auto flex max-w-7xl items-center justify-between p-4"><a href="/admin" class="text-xl font-bold text-cyan-400">Aniz Control</a><a href="/admin" class="text-slate-300 hover:text-white">Dashboard</a></div></nav><main class="mx-auto max-w-7xl space-y-6 p-4 md:p-8"><div><h1 class="text-3xl font-bold">Nyaa Search Engine</h1><p class="mt-2 text-slate-400">Search up to 500 results, inspect torrent contents, and queue selected magnets.</p></div><form id="search-form" class="flex gap-3"><input id="query" class="flex-1 rounded-xl border border-slate-700 bg-slate-900 p-4" placeholder="anime title, release group, Arabic..." required><button class="rounded-xl bg-cyan-500 px-8 font-semibold text-slate-950">Search</button></form><div id="status" class="text-sm text-slate-400"></div><section class="rounded-xl border border-slate-800 bg-slate-900 p-4"><div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4"><label class="flex items-center gap-2"><input id="select-all" type="checkbox"> Select all on page</label><div class="flex items-center gap-3"><span id="page-label" class="text-sm text-slate-400"></span><button id="queue" class="rounded-lg bg-fuchsia-500 px-4 py-2 font-semibold text-slate-950">Download Selected</button></div></div><div id="results" class="divide-y divide-slate-800"></div><div class="mt-4 flex justify-between"><button id="prev" class="rounded-lg border border-slate-700 px-4 py-2">← Prev</button><button id="next" class="rounded-lg border border-slate-700 px-4 py-2">Next →</button></div></section></main><div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black/70 p-4"><div class="w-full max-w-2xl rounded-xl border border-slate-700 bg-slate-900 p-6"><div class="flex justify-between"><h2 id="modal-title" class="text-xl font-semibold">File list</h2><button id="close" class="text-2xl">×</button></div><pre id="file-list" class="mt-4 max-h-96 overflow-auto rounded bg-slate-950 p-4 text-sm"></pre></div></div><script>let all=[],page=0;const perPage=30;const tags={pack:'bg-amber-950 text-amber-300',ara:'bg-red-950 text-red-300',eng:'bg-blue-950 text-blue-300',mp4:'bg-emerald-950 text-emerald-300',mkv:'bg-purple-950 text-purple-300'};function render(){const start=page*perPage,items=all.slice(start,start+perPage);document.getElementById('page-label').textContent=all.length?`Page ${page+1} / ${Math.ceil(all.length/perPage)} (${all.length} results)`:'';document.getElementById('results').innerHTML=items.map((r,i)=>`<div class="flex items-start gap-3 py-4"><input class="pick mt-1" type="checkbox" data-index="${start+i}"><div class="min-w-0 flex-1"><a href="${r.page_url}" target="_blank" class="font-medium text-cyan-300 hover:underline">${r.title}</a><div class="mt-2 flex flex-wrap gap-2">${r.tags.map(t=>`<span class="rounded px-2 py-1 text-xs ${tags[t]}">${t}</span>`).join('')}<span class="text-xs text-slate-500">${r.size} · seeders ${r.seeders}</span></div></div><button class="inspect rounded border border-slate-700 px-3 py-1 text-sm" data-view="${r.nyaa_id}">Inspect</button></div>`).join('');document.querySelectorAll('.inspect').forEach(b=>b.onclick=()=>inspect(b.dataset.view));document.getElementById('select-all').checked=false}async function inspect(view){const d=await fetch('/api/v1/admin/nyaa/inspect?view='+view).then(r=>r.json());document.getElementById('modal-title').textContent='Torrent '+view+' file list';document.getElementById('file-list').textContent=(d.files||[]).map(x=>`${x.name}\t${x.size}`).join('\n')||'No file rows detected';document.getElementById('modal').classList.replace('hidden','flex')}document.getElementById('close').onclick=()=>document.getElementById('modal').classList.replace('flex','hidden');document.getElementById('search-form').onsubmit=async e=>{e.preventDefault();document.getElementById('status').textContent='Searching Nyaa...';const d=await fetch('/api/v1/admin/nyaa/search?q='+encodeURIComponent(document.getElementById('query').value)).then(r=>r.json());all=d.results||[];page=0;document.getElementById('status').textContent=`Found ${all.length} results; Arabic-tagged results are prioritized.`;render()};document.getElementById('prev').onclick=()=>{if(page>0){page--;render()}};document.getElementById('next').onclick=()=>{if((page+1)*perPage<all.length){page++;render()}};document.getElementById('select-all').onchange=e=>document.querySelectorAll('.pick').forEach(x=>x.checked=e.target.checked);document.getElementById('queue').onclick=async()=>{const selected=[...document.querySelectorAll('.pick:checked')].map(x=>all[Number(x.dataset.index)]);if(!selected.length)return;const r=await fetch('/api/v1/admin/nyaa/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:selected})});document.getElementById('status').textContent=r.ok?`Queued ${selected.length} selected result(s).`:'Queue failed';}</script></body></html>
