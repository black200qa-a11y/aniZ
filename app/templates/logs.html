<!doctype html><html lang="en" class="bg-slate-950 text-slate-100"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aniz Logs</title><script src="https://cdn.tailwindcss.com"></script></head><body><main class="mx-auto max-w-7xl p-4 md:p-8"><div class="flex items-center justify-between"><h1 class="text-3xl font-bold text-cyan-400">Live logs</h1><a href="/admin" class="text-slate-400 hover:text-white">Back</a></div><div class="mt-6 grid gap-6 lg:grid-cols-2"><section><h2 class="mb-2 font-semibold">pipeline.log</h2><pre id="pipeline" class="h-[70vh] overflow-auto rounded-xl border border-slate-800 bg-black p-4 text-xs text-slate-300"></pre></section><section><h2 class="mb-2 font-semibold">errors.log</h2><pre id="errors" class="h-[70vh] overflow-auto rounded-xl border border-red-950 bg-black p-4 text-xs text-red-200"></pre></section></div></main><script>async function load(name){const d=await fetch('/admin/api/logs?filename='+name).then(r=>r.json());document.getElementById(name.replace('.log','')).textContent=d.lines.join('\n')}async function refresh(){await Promise.all([load('pipeline.log'),load('errors.log')])}refresh();setInterval(refresh,5000)</script></body></html>
