[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aniz-pipeline"
version = "0.1.0"
description = "Async RSS -> aria2 -> Telegram media pipeline"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "aria2p>=0.12,<1",
  "feedparser>=6.0,<7",
  "pydantic-settings>=2.2,<3",
  "pyrogram>=2.0,<3",
  "TgCrypto>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
aniz-pipeline = "aniz_pipeline.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
