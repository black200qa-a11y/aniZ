[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aniz-pipeline"
version = "0.2.0"
description = "Async RSS -> aria2 -> Telegram media pipeline with MongoDB catalog and streaming API"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "aria2p>=0.12,<1",
  "feedparser>=6.0,<7",
  "fastapi>=0.115,<1",
  "motor>=3.6,<4",
  "loguru>=0.7,<1",
  "psutil>=6,<7",
  "pymongo>=4.8,<5",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "pydantic-settings>=2.2,<3",
  "pyrogram>=2.0,<3",
  "TgCrypto>=1.2,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
aniz-pipeline = "aniz_pipeline.main:cli"
aniz-api = "app.main:run"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["aniz_pipeline*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
